<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <!-- Load HTMX instead of jQuery -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Keep your clock script if you still use it -->
    <script src="js/clock.js" charset="utf-8"></script>

    <title>IOT-Abfahrtsbildschirm</title>
  </head>
  <body>

    <!-- Native HTMX Form: Sends a GET to /board and puts the result in #board-container -->
    <form id="setup-form" hx-get="board" hx-target="#board-container" hx-swap="outerHTML">
      <div>
        <input type="text" id="station" name="station" placeholder="Bahnhof" required>
      </div>
      <br>

      <div>
        <label for="interval">Intervall</label>
        <div>
          <input type="range" id="interval" name="intervall" min="5" max="600" value="60"
                 oninput="document.getElementById('amount').innerText = this.value + ' Sekunden'">
          <label for="interval" id="amount">60 Sekunden</label>
        </div>
      </div>

      <div>
        <label for="results">Anzahl Resultate</label>
        <br>
        <input type="number" id="results" name="results" min="5" max="20" value="5">
      </div>

      <div>
        <input type="submit" value="Submit">
      </div>
    </form>

    <!-- This container will be replaced by the HTML generated in Bun -->
    <div id="board-container">
      <h2 id="bahnhof"></h2>
      <table id="list"></table>
    </div>

    <!-- SBB Clock -->
    <canvas id="sbb-clock" width="200" height="200" style="position: absolute; top: 20px; right: 20px;"></canvas>

    <script>
      // Listen for the HTMX trigger from our server
      document.body.addEventListener("hideForm", function() {
        const form = document.getElementById("setup-form");
        if (form) form.style.display = "none";
      });
    </script>
  </body>
</html>
